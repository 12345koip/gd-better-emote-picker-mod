name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Download Custom Emotes API
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/geode-deps/kx_.custom-emotes-api"

          curl.exe -L --fail --retry 3 "https://github.com/12345koip/gd-custom-emotes-api-mod/releases/download/custom-emotes-api-v1.0.1/kx_.custom-emotes-api.geode" -o dependency.geode

          7z x dependency.geode -o"build/geode-deps/kx_.custom-emotes-api" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract the Custom Emotes API package"
          }

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
