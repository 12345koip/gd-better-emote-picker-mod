
name: Build Geode Mod

on:
  push:

jobs:
  build:
    name: Build ${{ matrix.config.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        config:
          - target: win
          - target: macm1
          - target: macintel
          - target: ios
          - target: android32
          - target: android64

    steps:
      - uses: actions/checkout@v7

      - name: Download Custom Emotes API
        run: |
          mkdir -p external_deps
          curl -fL --retry 3 "https://github.com/12345koip/gd-custom-emotes-api-mod/releases/download/custom-emotes-api-v1.0.1/kx_.custom-emotes-api.geode" -o external_deps/kx_.custom-emotes-api.geode

      - uses: geode-sdk/build-geode-mod-docker@main
        with:
          target: ${{ matrix.config.target }}
          external-mods: ${{ github.workspace }}/external_deps
          upload: true

  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod-docker/merge@main
        with:
          upload: true
